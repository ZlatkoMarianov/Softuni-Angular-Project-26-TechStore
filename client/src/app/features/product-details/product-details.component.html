<section class="section">
  <div class="container">

    <div class="details">
      <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9" alt="product">

      <div>
        <h2>Product Name</h2>
        <p class="price">$0</p>
        <p>Product description goes here.</p>

        <div class="actions">
          <button class="btn">Add to Favorites</button>
          <button class="btn-secondary">Edit</button>
          <button class="btn-danger">Delete</button>
        </div>
      </div>
    </div>

  </div>
</section>

<section class="section alt">
  <div class="container">
    <h2 class="title">Comments</h2>

    <div class="comment">
      <div class="comment-meta">
        <div class="comment-avatar">I</div>
        <strong>Ivan</strong>
        <time>2 days ago</time>
      </div>
      <p>Very good product!</p>
    </div>

    <form class="comment-form">
      <label for="comment-text">Your comment</label>
      <textarea id="comment-text" placeholder="Write a comment..."></textarea>
      <button class="btn" type="submit">Post Comment</button>
    </form>
  </div>
</section>
