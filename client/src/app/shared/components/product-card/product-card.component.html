<div class="card">
  <img [src]="product.imageUrl || 'assets/no-image.png'" [alt]="product.name">
  <div class="card-body">
    <h3>{{ product.name }}</h3>
    <p>{{ product.description | truncate:120 }}</p>
    <div class="card-bottom">
      <span>{{ product.price | number:'1.2-2' }} €</span>
      <a class="btn-small" [routerLink]="['/products', product._id]">Details</a>
    </div>

    @if (showOwnerActions) {
    <div class="card-actions">
      <button type="button" class="btn-small" (click)="onEdit()">Edit</button>
      <button type="button" class="btn-small btn-danger" (click)="onDelete()">Delete</button>
    </div>
    }

  </div>
</div>
